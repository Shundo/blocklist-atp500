name: Aggiorna blocklist ATP500

on:
  schedule:
    - cron: "20 3 * * *"   # ogni notte alle 03:20 UTC, cioe 05:20 in ora legale italiana
  workflow_dispatch:        # consente anche l'avvio manuale dalla scheda Actions

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Preleva il repository
        uses: actions/checkout@v4

      - name: Predispone Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rigenera la lista dei domini
        run: python3 genera-blocklist.py

      - name: Registra le variazioni
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ultimo-controllo.txt cambia a ogni esecuzione riuscita, quindi il
          # commit avviene sempre. E deliberato: la data pubblicata e l'unico
          # segnale che dice se la catena e ancora viva. Il messaggio distingue
          # i due casi per non far sembrare una rotazione cio che non lo e.
          if [ -n "$(git status --porcelain blocklist.txt)" ]; then
            MESSAGGIO="Aggiornamento automatico della blocklist"
          else
            MESSAGGIO="Verifica automatica: nessuna variazione nei domini"
          fi
          git add blocklist.txt ultimo-controllo.txt
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "$MESSAGGIO"
            git push
          else
            echo "Nulla da registrare."
          fi
