name: Aggiorna blocklist ATP500

on:
  schedule:
    - cron: "20 3 * * *"   # ogni notte alle 03:20 UTC, cioe 05:20 in ora legale italiana
  workflow_dispatch:        # consente anche l'avvio manuale dalla scheda Actions
    inputs:
      accetta_variazione:
        description: >-
          Accetta una variazione che le soglie relative rifiutano. Usare SOLO
          dopo aver letto il messaggio di rifiuto e verificato che i domini
          perduti corrispondano a rotazioni reali o a testate che il tracker
          ha smesso di seguire. Pavimento, tetto e domini intoccabili restano
          attivi anche con questa opzione.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Preleva il repository
        uses: actions/checkout@v7

      - name: Predispone Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rigenera la lista dei domini
        id: genera
        env:
          # L'input esiste solo sugli avvii manuali: sugli avvii schedulati la
          # variabile resta vuota e le soglie restano pienamente attive.
          ATP_ACCETTA_VARIAZIONE: ${{ inputs.accetta_variazione && '1' || '' }}
        run: |
          set -o pipefail
          python3 genera-blocklist.py 2>&1 | tee uscita.txt

      - name: Riporta il motivo del rifiuto nel riassunto del run
        if: failure()
        run: |
          # Senza questo passo il motivo del rifiuto resta sepolto nel log
          # dello step e va cercato a mano: qui compare nella pagina del run.
          {
            echo "## Errore inatteso dello script"
            echo
            echo '```'
            tail -n 20 uscita.txt 2>/dev/null || echo "(nessuna uscita catturata)"
            echo '```'
            echo
            echo "Lo script gestisce da se i guasti del tracker senza fallire:"
            echo "un fallimento qui indica un errore di programma da correggere."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Registra le variazioni
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ultimo-controllo.txt cambia a ogni esecuzione riuscita, quindi il
          # commit avviene sempre. E deliberato: la data pubblicata e l'unico
          # segnale che dice se la catena e ancora viva. Il messaggio distingue
          # i due casi per non far sembrare una rotazione cio che non lo e.
          if [ -n "$(git status --porcelain blocklist.txt)" ]; then
            MESSAGGIO="Aggiornamento automatico della blocklist"
          else
            MESSAGGIO="Verifica automatica: nessuna variazione nei domini"
          fi
          git add blocklist.txt ultimo-controllo.txt registro.json
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "$MESSAGGIO"
            git push
          else
            echo "Nulla da registrare."
          fi
